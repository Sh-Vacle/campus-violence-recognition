<svg xmlns="http://www.w3.org/2000/svg" width="460" height="620" viewBox="0 0 460 620" role="img"><title>视频训练和推理两条实际流程</title><rect width="460" height="620" rx="12" fill="#faf8ff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle"><rect x="26" y="18" width="408" height="66" rx="33" fill="#262238"/><text x="230" y="45" fill="white" font-size="19">合法取得的视频 → FFmpeg抽帧</text><text x="230" y="67" fill="#c4b5fd" font-size="14">训练数据与单视频输入分别进入两条流程</text><text x="120" y="128" fill="#6d28d9" font-size="19" font-weight="600">训练 / 帧级验证</text><text x="340" y="128" fill="#0e7490" font-size="19" font-weight="600">单视频推理</text></g><rect x="26" y="150" width="188" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#262238"><text x="120" y="181" font-size="17" font-weight="600">帧目录与类别检查</text><text x="120" y="206" font-size="13">20%帧级验证划分</text></g><path d="M120 228v25l-5-7m5 7 5-7" stroke="#7c3aed" stroke-width="2" fill="none"/><rect x="26" y="266" width="188" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#262238"><text x="120" y="297" font-size="17" font-weight="600">MobileNetV2训练</text><text x="120" y="322" font-size="13">冻结 / 可选微调</text></g><path d="M120 344v25l-5-7m5 7 5-7" stroke="#7c3aed" stroke-width="2" fill="none"/><rect x="26" y="382" width="188" height="78" rx="24" fill="#ede9fe" stroke="#7c3aed"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#262238"><text x="120" y="413" font-size="17" font-weight="600">帧级指标与模型</text><text x="120" y="438" font-size="13">H5 / FP16 TFLite</text></g><rect x="246" y="150" width="188" height="78" rx="8" fill="#cffafe" stroke="#0891b2"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#262238"><text x="340" y="181" font-size="17" font-weight="600">单视频逐帧输入</text><text x="340" y="206" font-size="13">与训练分离的运行入口</text></g><path d="M340 228v25l-5-7m5 7 5-7" stroke="#0891b2" stroke-width="2" fill="none"/><rect x="246" y="266" width="188" height="78" rx="8" fill="#cffafe" stroke="#0891b2"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#262238"><text x="340" y="297" font-size="17" font-weight="600">使用已训练H5</text><text x="340" y="322" font-size="13">输出各帧暴力概率</text></g><path d="M340 344v25l-5-7m5 7 5-7" stroke="#0891b2" stroke-width="2" fill="none"/><rect x="246" y="382" width="188" height="78" rx="24" fill="#cffafe" stroke="#0891b2"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#262238"><text x="340" y="413" font-size="17" font-weight="600">帧概率取均值</text><text x="340" y="438" font-size="13">生成视频分类标签</text></g><path d="M120 84v19m220-19v19M214 418h16V300h16" stroke="#52525b" stroke-width="2" stroke-dasharray="4 3" fill="none"/><path d="m239 295 7 5-7 5" fill="#52525b"/><text x="230" y="535" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#52525b">虚线：训练所得模型用于推理；不是时序动作网络</text><text x="230" y="566" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#52525b">历史帧级验证不等于视频级独立测试</text></svg>
